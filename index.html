<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slikskak</title>

<style>

:root {
    --frame-color: #fffdf4;
    --text-color: #000;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: var(--frame-color);
    overflow: hidden;
    font-family: Helvetica, Arial, sans-serif;
    position: relative;
}

/* Image area */

.hero {
    position: absolute;
    top: 40px;
    left: 12px;
    right: 12px;
    bottom: 28px;

    background-image: url('larsen.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.18);
}

/* Logo in top frame */

.logo {
    position: absolute;
    top: 10px;
    left: 12px;
    z-index: 10;
}

.logo img {
    height: 20px;
    width: auto;
    display: block;
}

/* Footer in bottom frame */

.footer {
    position: absolute;
    left: 12px;
    bottom: 8px;
    z-index: 10;

    font-size: 12px;
    color: #111;
    letter-spacing: -0.01em;
}

.footer a {
    color: inherit;
    text-decoration: none;
}

.footer a:hover {
    opacity: 0.7;
}

@media (max-width: 768px) {

    .logo img {
        height: 20px;
    }

    .footer {
        font-size: 12px;
    }
}

</style>
</head>

<body>

<div class="logo">
    <img src="logo-slikskak.svg" alt="Slikskak">
</div>

<div class="hero"></div>

<div class="footer">
    Make your first move at
    <a href="mailto:opening@slikskak.com">opening@slikskak.com</a>
</div>

</body>
</html>
