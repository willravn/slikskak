<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slikskak</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    position: relative;
    overflow: hidden;
    font-family: Helvetica, Arial, sans-serif;
}

/* Background image */

.background {
    position: fixed;
    inset: 0;
    background-image: url('larsen.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 1;
}

/* Subtle dark overlay */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.22);
    z-index: 2;
}

/* Contact */

.contact {
    position: fixed;
    left: 24px;
    bottom: 24px;
    z-index: 3;

    color: #e6dd8c;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.02em;
}

.contact a {
    color: inherit;
    text-decoration: none;
}

.contact a:hover {
    opacity: 0.7;
}

@media (max-width: 768px) {

    .contact {
        left: 16px;
        bottom: 16px;
        font-size: 16px;
    }

}

</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="contact">
    get in touch at<br>
    <a href="mailto:yourmove@slikskak.com">
        yourmove@slikskak.com
    </a>
</div>

</body>
</html>
