<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slikskak</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {
        background: url('larsen.jpg') center center / cover no-repeat;
        font-family: Helvetica, Arial, sans-serif;
        overflow: hidden;
    }

    .contact {
        position: fixed;
        left: 24px;
        bottom: 24px;
        color: #e6dd8c;
        font-size: 18px;
        font-weight: 800;
        line-height: 1.0;
        letter-spacing: -0.02em;
        text-transform: lowercase;
        max-width: 400px;
    }

    .contact a {
        color: inherit;
        text-decoration: none;
    }

    .contact a:hover {
        opacity: 0.8;
    }

    @media (max-width: 768px) {
        .contact {
            left: 16px;
            bottom: 16px;
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="contact">
    get in touch at<br>
    <a href="mailto:yourmove@slikskak.com">yourmove@slikskak.com</a>
</div>

</body>
</html>
